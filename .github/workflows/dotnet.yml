name: .NET CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore DeliveryPlatform.slnx

      - name: Build solution
        run: dotnet build DeliveryPlatform.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test Delivery.UnitTests/Delivery.UnitTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Run integration tests
        run: dotnet test Delivery.IntegrationTests/Delivery.IntegrationTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"